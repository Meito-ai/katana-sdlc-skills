# APM manifest for katana-sdlc-skills.
#
# This repo plays two roles at once, and the shape below is the only one that
# supports both (every claim here was verified against apm 0.32.0 -- see
# AGENTS.md "APM design constraints" for the experiments):
#
#   Producer -- the skills under src/skills/ are published to consumers
#               (meito et al.), who reference each one by subpath at a git tag.
#   Consumer -- the dependencies below are the skills agents use *here*.
#
# Requires apm >= 0.16.0 for the `ref:` semver ranges below; pinned to 0.32.0
# in CI. `apm --version` must report 0.32.x before running `apm install`.
name: katana-sdlc-skills
version: 0.1.0
description: Skills to power up your repo with AI-driven SDLC
license: MIT
repository: https://github.com/Meito-ai/katana-sdlc-skills
keywords:
  - skills
  - sdlc
  - agents
  - code-review

# `agent-skills` writes the canonical .agents/skills/ tree; `claude` is what
# populates .claude/skills/, which is where Claude Code actually reads from.
# `agent-skills` ALONE creates no .claude/ directory at all -- verified.
# Neither target writes AGENTS.md or CLAUDE.md on `apm install` (only
# `apm compile` does, and we never run it), so both files stay hand-authored.
targets:
  - agent-skills
  - claude

# ---------------------------------------------------------------------------
# dependencies vs devDependencies -- this distinction is load-bearing.
#
#   dependencies:     travel transitively to anyone who installs this package.
#                     Use for upstream skills that OUR published skills invoke,
#                     so a consumer importing only katana-sdlc-skills still
#                     gets a working install.
#   devDependencies:  stay here. Authoring-time helpers only.
#
# Nothing is published from src/skills/ yet, so every entry is dev-only for
# now. When a published skill starts delegating to an upstream skill, that
# entry MOVES to `dependencies:` and the skill's SKILL.md states the
# requirement in prose as well -- a consumer that already pins this repo at an
# older ref silently wins the version resolution, with no warning from apm.
#
# HARD RULE: never list the same upstream repo under both keys. apm dedupes by
# repo and silently drops one subset -- no error, no warning.
# ---------------------------------------------------------------------------
devDependencies:
  apm:
    # --- Own skills, self-referenced so `apm install` deploys them locally.
    # Without an entry here a skill under src/skills/ is still published to
    # consumers, but is NOT installed into this repo's .claude/skills/, so you
    # cannot use it while authoring. One line per skill; CI enforces the pairing.
    # (none yet)

    # Pinned by semver range; the resolved tag + commit land in apm.lock.yaml,
    # which is committed. CI runs `apm install --frozen`, so a new upstream tag
    # can never enter a build without a lockfile diff in the PR.
    - git: mattpocock/skills
      ref: "^1.2.0"
      skills:
        # Authoring the skills this repo ships.
        - productivity/writing-for-agents
        # Design review / stress-testing. grill-me delegates to grilling, so
        # both are listed -- apm does not infer it.
        - productivity/grilling
        - productivity/grill-me
        # Reviewing changes to this repo.
        - engineering/code-review
        - engineering/codebase-design

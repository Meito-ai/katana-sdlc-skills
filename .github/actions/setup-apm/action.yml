name: Set up APM CLI
description: Install the pinned, checksum-verified apm CLI and put it on PATH.

inputs:
  version:
    # The one CI pin. Must match the version documented in AGENTS.md: this
    # repo's apm.yml uses `ref:` semver ranges, which do not exist before apm
    # 0.16.0.
    description: apm release tag to install
    default: v0.32.0

runs:
  using: composite
  steps:
    - name: Install APM CLI (pinned + checksum-verified)
      # Staged in RUNNER_TEMP, deliberately outside the checkout: anything
      # downloaded into the workspace would show up as untracked files and
      # trip apm-check's "generated output stayed out of git" assert.
      shell: bash
      env:
        APM_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        TAR="apm-linux-x86_64.tar.gz"
        BASE="https://github.com/microsoft/apm/releases/download/${APM_VERSION}"
        curl -sSLf -o "$TAR" "${BASE}/${TAR}"
        curl -sSLf -o "${TAR}.sha256" "${BASE}/${TAR}.sha256"
        sha256sum -c "${TAR}.sha256"
        mkdir -p apm-bin && tar -xzf "$TAR" -C apm-bin
        BIN="$(find apm-bin -name apm -type f -perm -u+x | head -1)"
        if [ -z "$BIN" ]; then echo "::error::apm binary not found in tarball"; exit 1; fi
        echo "$(pwd)/$(dirname "$BIN")" >> "$GITHUB_PATH"

    - name: Verify CLI version matches the pin
      shell: bash
      env:
        APM_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        OUT="$(apm --version)"; echo "$OUT"
        case "$OUT" in
          *"${APM_VERSION#v}"*) ;;
          *) echo "::error::apm --version did not contain ${APM_VERSION#v}: $OUT"; exit 1 ;;
        esac

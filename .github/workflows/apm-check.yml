name: APM Check

# Two things this must catch, both of which are silent failures otherwise:
#
#  1. Dependency drift -- `apm install --frozen` refuses to install when
#     apm.lock.yaml is missing or out of sync with apm.yml. Because apm.yml
#     pins by semver RANGE, this is what stops a new upstream tag entering a
#     build without a lockfile diff visible in the PR.
#  2. Published skills that silently do not ship -- see scripts/validate-skills.js.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: apm-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  apm:
    name: apm install --frozen + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Pins the apm version; see the action for why it matters.
      - uses: ./.github/actions/setup-apm

      - name: Cache apm_modules
        # _local/ holds copies of this repo's own skills, so caching it saves
        # nothing, and a stale copy is harmful: restored via restore-keys after
        # a version bump, it makes `apm install --frozen` (0.32.0) record the
        # old version in apm.lock.yaml before refreshing the copy -- verified.
        #
        # actions/cache globs with implicitDescendants off: `apm_modules` alone
        # names one directory that tar packs whole, so the exclusion must sit
        # beside its children (`apm_modules/*`). The `v2` key prefix keeps
        # restore-keys from reaching the entries saved before that, which all
        # hold a _local/.
        uses: actions/cache@v4
        with:
          path: |
            apm_modules/*
            !apm_modules/_local
          key: apm-modules-v2-${{ runner.os }}-${{ hashFiles('apm.lock.yaml') }}
          restore-keys: apm-modules-v2-${{ runner.os }}-

      - name: apm install --frozen
        run: apm install --frozen

      - name: apm audit
        # Content-integrity scan: hidden Unicode / bidi-override characters
        # across deployed files, including this repo's own .apm/ content. A
        # SKILL.md is instructions an agent obeys, so an invisible-character
        # injection is a prompt-injection vector, not a typo.
        run: apm audit

      - name: Assert generated output stayed out of git
        # .agents/ and .claude/skills/ are gitignored and reproducible. If a
        # deploy path ever escapes .gitignore, fail here rather than let
        # vendored copies of upstream skills get committed.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after apm install -- a deploy path escaped .gitignore, or a CI step wrote into the checkout:"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

  manifest:
    name: version sync + skill layout + script specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The scripts are dependency-free, so there is deliberately no npm install.
      - run: node scripts/sync-apm-version.js --check
      - run: node scripts/validate-skills.js
      # Every skill has a README row, stamped since it last changed; see AGENTS.md.
      - run: node scripts/sync-readme.js
      # Specs for the scripts that ship inside skills (e.g. visual-pr).
      - run: npm test

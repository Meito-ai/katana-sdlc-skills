name: Release

# On every push to main, changesets/action does one of two things:
#
#  - Changesets pending: open or refresh the "Version Packages" PR from
#    changeset-release/main. Its commit is `npm run version`: bump
#    package.json, write CHANGELOG.md, sync every apm.yml, re-lock apm.
#  - None pending (the Version PR was just merged): `changeset publish` tags
#    the merge commit vX.Y.Z and the action creates the GitHub Release from
#    that version's CHANGELOG.md section. Nothing goes to npm ("private": true).
#
# The token comes from a GitHub App, not GITHUB_TOKEN: a PR opened with
# GITHUB_TOKEN triggers no workflows, so the required apm check would never
# run on the Version PR. The App needs no ruleset bypass -- it never writes to
# main, only to its own branch and to new v* tags.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version PR or tag + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          # `changeset version` reads git history to find each changeset's commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run version` ends in `apm install`: the self-references hash the
      # new version into apm.lock.yaml.
      - uses: ./.github/actions/setup-apm

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: npm run version
          publish-script: npx changeset publish
          commit-message: "release: version packages"
          pr-title: "Release: version packages"
